    <script>
      (function () {
        const NativeWebSocket = window.WebSocket;
        if (!NativeWebSocket) return;
        function GuardedWebSocket(url, protocols) {
          const urlStr = String(url || '');
          const protoStr = Array.isArray(protocols) ? protocols.join(',') : String(protocols || '');
          if (protoStr.includes('vite-hmr') || protoStr.includes('vite-ping') || urlStr.includes('vite')) {
            return {
              url: urlStr,
              readyState: 1,
              protocol: protoStr,
              extensions: '',
              bufferedAmount: 0,
              binaryType: 'blob',
              send: function () {},
              close: function () {},
              addEventListener: function () {},
              removeEventListener: function () {},
              dispatchEvent: function () { return true; },
              onopen: null,
              onmessage: null,
              onerror: null,
              onclose: null,
            };
          }
          return protocols !== undefined
            ? new NativeWebSocket(url, protocols)
            : new NativeWebSocket(url);
        }
        GuardedWebSocket.prototype = NativeWebSocket.prototype;
        GuardedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        GuardedWebSocket.OPEN = NativeWebSocket.OPEN;
        GuardedWebSocket.CLOSING = NativeWebSocket.CLOSING;
        GuardedWebSocket.CLOSED = NativeWebSocket.CLOSED;
        window.WebSocket = GuardedWebSocket;
      })();
    </script>
